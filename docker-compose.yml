services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-procureflow}
      POSTGRES_USER: ${POSTGRES_USER:-procureflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-procureflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-procureflow} -d $${POSTGRES_DB:-procureflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
