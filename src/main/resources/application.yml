spring:
  application:
    name: procureflow-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/procureflow}
    username: ${DATABASE_USERNAME:procureflow}
    password: ${DATABASE_PASSWORD:procureflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
info:
  app:
    name: ProcureFlow API
    description: B2B procurement and inventory platform
jwt:
  secret: ${JWT_SECRET:replace-this-development-secret-with-at-least-32-characters}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
